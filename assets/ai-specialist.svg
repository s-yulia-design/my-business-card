<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc">
  <title id="title">Futuristic digital specialist</title>
  <desc id="desc">Stylized image of a specialist in a silver suit with holographic interfaces.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f5ff"/>
      <stop offset=".45" stop-color="#dff8ff"/>
      <stop offset="1" stop-color="#f6ddff"/>
    </linearGradient>
    <linearGradient id="suit" x1=".12" y1=".08" x2=".92" y2=".94">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".22" stop-color="#c9d0e8"/>
      <stop offset=".48" stop-color="#f7e2ff"/>
      <stop offset=".68" stop-color="#97f0ff"/>
      <stop offset="1" stop-color="#a8a5d6"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4de"/>
      <stop offset="1" stop-color="#f1bdc0"/>
    </linearGradient>
    <linearGradient id="hair" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fff7f3"/>
      <stop offset=".5" stop-color="#e7c5c7"/>
      <stop offset="1" stop-color="#bf9aa8"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.82 0 0 0 0 1 0 0 0 .72 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#2b2553" flood-opacity=".2"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#7ddef2" stroke-opacity=".18"/>
    </pattern>
  </defs>

  <rect width="760" height="1040" rx="42" fill="url(#room)"/>
